<div class="offcanvas offcanvas-end" tabindex="-1" id="themePanel">

    <div class="offcanvas-header">

        <h5 class="offcanvas-title">
            <i class="fa-solid fa-palette text-primary me-2"></i>
            Theme Settings
        </h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body">

        <!-- Navbar -->

        <h6 class="fw-bold mb-3">
            Navbar Colors
        </h6>

        <div class="d-flex flex-wrap gap-2 mb-4">

            <button class="btn btn-primary rounded-circle p-3 navbar-color" data-color="bg-primary"></button>

            <button class="btn btn-success rounded-circle p-3 navbar-color" data-color="bg-success"></button>

            <button class="btn btn-danger rounded-circle p-3 navbar-color" data-color="bg-danger"></button>

            <button class="btn btn-warning rounded-circle p-3 navbar-color" data-color="bg-warning"></button>

            <button class="btn btn-dark rounded-circle p-3 navbar-color" data-color="bg-dark"></button>

        </div>

        <hr>

        <!-- Sidebar -->

        <h6 class="fw-bold mb-3">
            Sidebar Colors
        </h6>

        <div class="d-flex flex-wrap gap-2 mb-4">

            <button class="btn btn-primary rounded-circle p-3 sidebar-color" data-color="bg-primary"></button>

            <button class="btn btn-success rounded-circle p-3 sidebar-color" data-color="bg-success"></button>

            <button class="btn btn-danger rounded-circle p-3 sidebar-color" data-color="bg-danger"></button>

            <button class="btn btn-warning rounded-circle p-3 sidebar-color" data-color="bg-warning"></button>

            <button class="btn btn-dark rounded-circle p-3 sidebar-color" data-color="bg-dark"></button>

        </div>

        <hr>

        <!-- Dark Mode -->

        <div class="form-check form-switch mb-4">

            <input class="form-check-input"
                   type="checkbox"
                   id="darkMode">

            <label class="form-check-label"
                   for="darkMode">

                Dark Mode

            </label>

        </div>

        <!-- Card Style -->

        <h6 class="fw-bold mb-3">
            Card Style
        </h6>

        <select class="form-select mb-4"
                id="cardStyle">

            <option value="rounded">
                Rounded
            </option>

            <option value="square">
                Square
            </option>

            <option value="glass">
                Glass
            </option>

        </select>

        <!-- Compact Sidebar -->

        <div class="form-check form-switch">

            <input class="form-check-input"
                   type="checkbox"
                   id="compactSidebar">

            <label class="form-check-label"
                   for="compactSidebar">

                Compact Sidebar

            </label>

        </div>

    </div>

</div>
