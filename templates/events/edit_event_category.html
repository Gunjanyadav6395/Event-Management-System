{% extends 'base/base.html' %}

{% block title %}
Edit Event Category
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h3 class="mb-0">
                Edit Event Category
            </h3>

            <a href="{% url 'category_list' %}" class="btn btn-success">
                Category List
            </a>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Name <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        name="category_name"
                        class="form-control"
                        value="{{ category.category_name }}"
                        required>

                </div>

                <!-- Code -->

                <div class="mb-3">

                    <label class="form-label">
                        Code <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        value="{{ category.code }}"
                        required>

                </div>

                <!-- Image -->

                <div class="mb-3">

                    <label class="form-label">
                        Image
                    </label>

                    {% if category.image %}
                        <div class="mb-2">
                            <img src="{{ category.image.url }}"
                                 width="120"
                                 class="img-thumbnail">
                        </div>
                    {% endif %}

                    <input
                        type="file"
                        name="image"
                        class="form-control">

                </div>

                <!-- Priority -->

                <div class="mb-3">

                    <label class="form-label">
                        Priority
                    </label>

                    <input
                        type="number"
                        name="priority"
                        class="form-control"
                        value="{{ category.priority }}">

                </div>

                <!-- Status -->

                <div class="mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active"
                            {% if category.status == "Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                            {% if category.status == "Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-pen"></i>
                    Update Category
                </button>

                <a href="{% url 'category_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
