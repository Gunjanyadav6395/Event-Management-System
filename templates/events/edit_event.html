{% extends 'base/base.html' %}

{% block title %}
Edit Event
{% endblock %}

{% block breadcrumb %}
Edit Event
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-md-12">

        <div class="card shadow">

            <div class="card-header">

                <div class="row">

                    <div class="col-md-10">
                        <h5>Edit Event</h5>
                    </div>

                    <div class="col-md-2 text-end">

                        <a href="{% url 'event_list' %}" class="btn btn-success">

                            Event List

                        </a>

                    </div>

                </div>

            </div>

            <div class="card-body">

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger">
                                    {{ field.errors }}
                                </div>
                            {% endif %}

                        </div>

                    {% endfor %}

                    <button type="submit" class="btn btn-warning">

                        Update Event

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
