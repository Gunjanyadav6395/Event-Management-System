{% extends "base/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4>Event Wish List</h4>
        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Event</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                {% for wish in wishes %}

                    <tr>

                        <td>{{ wish.id }}</td>

                        <td>{{ wish.user }}</td>

                        <td>{{ wish.event }}</td>

                        <td>
                            {% if wish.status %}
                                Active
                            {% else %}
                                Inactive
                            {% endif %}
                        </td>

                    </tr>

                {% empty %}

                    <tr>

                        <td colspan="4" class="text-center">

                            No Event Wish Found

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
