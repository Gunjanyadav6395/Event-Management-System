<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Management Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0">

                <!-- HEADER -->

                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        <i class="fa-solid fa-user-lock"></i>
                        Event Management Login
                    </h3>

                    <p class="mb-0 mt-2 small">
                        Admins and registered users can login here.
                    </p>

                </div>


                <!-- BODY -->

                <div class="card-body p-4">

                    {% if messages %}

    {% for message in messages %}

        <div
            class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
            role="alert"
        >

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
            </button>

        </div>

    {% endfor %}

{% endif %}

                    <form method="POST">

                        {% csrf_token %}


                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter Username"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    name="password"
                                    id="loginPassword"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="togglePassword()"
                                >

                                    <i
                                        class="fa-solid fa-eye"
                                        id="passwordIcon"
                                    ></i>

                                </button>

                            </div>

                        </div>

                        <div class="text-end mb-3">

    <a
        href="{% url 'password_reset' %}"
        class="text-decoration-none">

        Forgot Password?

    </a>

</div>
                        <!-- LOGIN BUTTON -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                <i class="fa-solid fa-right-to-bracket"></i>

                                Login

                            </button>

                        </div>

                    </form>


                    <!-- SIGN UP -->

                    <div class="text-center mt-3">

                        <span class="text-muted">
                            Don't have any account?
                        </span>

                        <a
                            href="{% url 'register_user' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Sign up
                        </a>

                    </div>


                    <!-- DIVIDER -->

                    <div class="d-flex align-items-center my-4">

                        <hr class="flex-grow-1">

                        <span class="px-3 text-muted small">
                            OR
                        </span>

                        <hr class="flex-grow-1">

                    </div>


                    <!-- GOOGLE LOGIN -->

                    <div class="d-grid">

                        <button
                            type="button"
                            class="btn btn-outline-dark"
                        >

                            <i class="fa-brands fa-google me-2"></i>

                            Continue with Google

                        </button>

                    </div>

                </div>


                <!-- FOOTER -->

                <div class="card-footer text-center text-muted">

                    © 2026 Event Management System

                </div>

            </div>

        </div>

    </div>

</div>


<!-- PASSWORD SHOW / HIDE -->

<script>

function togglePassword() {

    const password = document.getElementById("loginPassword");

    const icon = document.getElementById("passwordIcon");


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
